[package]
name = "juntei"
version = "0.1.0"
repository = "https://github.com/Yamato-Security/juntei"
authors = ["Yamato Security @SecurityYamato"]
description = "Windows forensics artifact parser"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.90"
include = ["src/**/*", "art/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

# Every dependency has an explicit floor rather than "*": a wildcard accepts any future
# release, including a breaking one, on the next `cargo update`.
[dependencies]
# Amcache parsing and output: Yamato Security's ys-amcache-parser (Apache-2.0), pinned to a commit.
amcache-forensic = { git = "https://github.com/Yamato-Security/ys-amcache-parser", rev = "3bfc944a9b5c4c46b94bda12ca6b9af9f83c255a" }
bytesize = "2"
# The Observation trait gives the severity of an Amcache finding; the system-binary and
# staging-directory lists drive the Prefetch findings.
forensicnomicon = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1"
indicatif = "0.18"
# $MFT parsing: Yamato Security's ys-mft-parser, a fork of Omer Ben-Amram's mft crate
# (MIT / Apache-2.0), pinned to a commit, without its mft_dump binary.
mft = { git = "https://github.com/Yamato-Security/ys-mft-parser", rev = "9ccde49d1ac252e64fa44af86adde6695989531a", default-features = false }
# Prefetch parsing: Yamato Security's ys-prefetch-parser, a fork of Samuel Garcés Marín's
# frnsc-prefetch crate (MIT), pinned to a commit.
frnsc-prefetch = { git = "https://github.com/Yamato-Security/ys-prefetch-parser", rev = "ef0ef23f649334981d28b8d76eb1608e6f69fbec" }
serde_json = "1"
# USN journal parsing: Yamato Security's ys-usn-journal-parser, a fork of sootmark-usn
# (MIT OR Apache-2.0), pinned to a commit; its `mft` feature seeds paths from the $MFT with the
# same ys-mft-parser commit as above.
usn = { package = "sootmark-usn", git = "https://github.com/Yamato-Security/ys-usn-journal-parser", rev = "dd3f51fce43626d9e39ddc0991edc7b4c5100f22", features = ["mft"] }
termcolor = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
